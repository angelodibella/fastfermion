[build-system]
requires = ["meson-python>=0.16", "meson>=1.2", "ninja", "pybind11>=2.13"]
build-backend = "mesonpy"

[project]
name = "fastfermion"
dynamic = ["version"]
description = "A library for manipulating polynomials in Pauli, Fermi and Majorana operators."
readme = "README.md"
authors = [{name = "Hamza Fawzi", email = "hamzafawzi@gmail.com"}]
requires-python = ">=3.10"
dependencies = ["scipy"]

[project.urls]
Homepage = "https://github.com/hfawzi/fastfermion"

[tool.cibuildwheel]
test-requires = ["pytest","openfermion","cirq"]
test-sources = ["test"]
test-command = "pytest test/"

# Builds to skip
skip = ["*-win32", "*-manylinux_i686", "*musllinux*", "cp314t-*"]
test-skip = "cp314-macosx_universal2:x86_64"

# For MacOS build a universal wheel, for x86 and arm64 architectures
[tool.cibuildwheel.macos]
archs = ["universal2"]
